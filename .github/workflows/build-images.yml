# Builds the JVM and native images and pushes them to GitHub Container Registry:
#   ghcr.io/<owner>/orderservice:jvm
#   ghcr.io/<owner>/orderservice:native
# The native build needs lots of memory, which is why it runs here and not on the 1 GB VPS.
name: Build images

on:
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    branches: [master]

permissions:
  contents: read
  packages: write           # allows pushing to ghcr.io with the built-in GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest  # amd64; the VPS must be amd64 too
    strategy:
      fail-fast: false
      matrix:
        variant: [jvm, native]
    steps:
      - uses: actions/checkout@v4

      - name: Show runner resources
        run: nproc && free -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orderservice" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.variant }}
            ${{ env.IMAGE }}:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
