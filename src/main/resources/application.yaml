# The SAME settings are used by the JVM and the native image, so the comparison is fair.
spring:
  application:
    name: orderservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 20   # fixed pool: both variants get exactly 20 DB connections
      minimum-idle: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # the table is created by Flyway (db/migration)
  threads:
    virtual:
      enabled: false          # keep classic Tomcat threads for both variants

server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true         # gives /actuator/health/readiness for the run scripts
